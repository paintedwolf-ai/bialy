# Public repositories the generated sessions work in, pinned by commit. Every
# license is permissive. `license_files` pins, by sha256, the license texts a
# person read at that commit to confirm the SPDX label; `repos verify` checks
# each pin and each text, and a dataset release ships the texts.
# Held-out repositories never contribute a training row: they measure a
# codebase the heads never saw.
repos:
