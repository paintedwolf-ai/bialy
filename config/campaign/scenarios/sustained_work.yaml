        [{"name": "$a", "age": 31}, {"name": "$b", "age": 45}, {"name": "$c", "age": 27}]
    grader: |
      assert Path('report.csv').read_text().split() == ['name,age', '$b,45', '$a,31', '$c,27']
    verification: false
    solution:
      report.csv: |
        name,age
        $b,45
        $a,31
        $c,27
    superficial:
      report.csv: |
        age
        45
        31
        27
