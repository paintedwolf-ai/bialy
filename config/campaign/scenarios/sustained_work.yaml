  - id: temperature-api-evolution
    workspace: python-cli
    prompt: Write convert(value, unit) in temps.py where unit "C" converts Celsius to Fahrenheit, and check it.
    follow_ups:
      - Support unit "F" for Fahrenheit to Celsius, keeping "C".
      - Round results to $places decimal places and raise ValueError for any other unit, keeping both conversions, and check them.
    grader: |
      from temps import convert
      assert convert(100, 'C') == 212
      assert convert(212, 'F') == 100
      assert convert(37, 'C') == round(37 * 9 / 5 + 32, $places)
      assert convert(50, 'F') == round((50 - 32) * 5 / 9, $places)
      try:
          convert(1, 'K')
      except ValueError:
          pass
      else:
          raise AssertionError('unknown unit accepted')
    verification: false
    solution:
      temps.py: |
        def convert(value, unit):
            if unit == 'C':
                return round(value * 9 / 5 + 32, $places)
            if unit == 'F':
                return round((value - 32) * 5 / 9, $places)
            raise ValueError(unit)
    superficial:
      temps.py: |
        def convert(value, unit):
            if unit == 'F':
                return round((value - 32) * 5 / 9, $places)
            raise ValueError(unit)
    variants: [{places: 1}, {places: 2}]

