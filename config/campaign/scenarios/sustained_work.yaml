# sustained_work: A task extended over several requests whose earlier requirements must all survive.

groups:
  - id: settings-requirements
    workspace: python-cli
    prompt: Inspect requirements.txt. Implement settings.json with those requirements and verify it; later requests will extend it.
    fixtures:
      requirements.txt: |
        Keep code '$token' and enabled=true in settings.json.
    follow_ups:
      - Add retries=3 while keeping every existing requirement, and verify the file.
      - Add mode="strict", keep the original code and every earlier requirement, and verify the result.
    grader: |
      assert json.loads(Path('settings.json').read_text()) == {'code': '$token', 'enabled': True, 'retries': 3, 'mode': 'strict'}
    verification: false
    solution:
      settings.json: |
        {"code": "$token", "enabled": true, "retries": 3, "mode": "strict"}
    superficial:
      settings.json: |
        {"retries": 3, "mode": "strict"}
    variants: [{token: batch-13}, {token: batch-31}]

  - id: todo-commands
    workspace: python-cli
    prompt: Add an add(text) function to todo.py that appends an item to todo.json (a JSON list), and check it works.
    fixtures:
      todo.py: |
        import json
        from pathlib import Path
        STORE = Path('todo.json')
        def items():
            return json.loads(STORE.read_text()) if STORE.exists() else []
    follow_ups:
      - Now add done(index) that removes that item, keeping add working.
      - Finally add count() returning how many items remain, and run all three together.
    grader: |
      import todo
      Path('todo.json').unlink(missing_ok=True)
      todo.add('$first'); todo.add('b'); todo.add('c')
      todo.done(1)
      assert todo.items() == ['$first', 'c'] and todo.count() == 2
    verification: false
    solution:
      todo.py: |
        import json
        from pathlib import Path
        STORE = Path('todo.json')
        def items():
            return json.loads(STORE.read_text()) if STORE.exists() else []
        def add(text):
            STORE.write_text(json.dumps(items() + [text]))
        def done(index):
            values = items()
            del values[index]
            STORE.write_text(json.dumps(values))
        def count():
            return len(items())
    superficial:
      todo.py: |
        import json
        from pathlib import Path
        STORE = Path('todo.json')
        def items():
            return json.loads(STORE.read_text()) if STORE.exists() else []
        def done(index):
            values = items()
            del values[index]
            STORE.write_text(json.dumps(values))
        def count():
            return len(items())
    variants: [{first: milk}, {first: post}]

  - id: inventory-report
    workspace: python-cli
    prompt: inventory.py tracks stock in stock.json. Add restock(name, n) and check it.
    fixtures:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
    follow_ups:
      - Add sell(name, n) that refuses to go below zero by raising ValueError, keeping restock.
      - 'Add report() returning the items sorted by name as "name: n" lines, and check everything still works.'
    grader: |
      import inventory
      Path('stock.json').unlink(missing_ok=True)
      inventory.restock('$item', 5); inventory.restock('apple', 2)
      inventory.sell('$item', 3)
      try:
          inventory.sell('apple', 3)
          raise AssertionError('oversold')
      except ValueError:
          pass
      assert inventory.report() == sorted(['$item: 2', 'apple: 2'])
    verification: false
    solution:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
        def _save(values):
            STORE.write_text(json.dumps(values))
        def restock(name, n):
            values = stock()
            values[name] = values.get(name, 0) + n
            _save(values)
        def sell(name, n):
            values = stock()
            if values.get(name, 0) < n:
                raise ValueError(name)
            values[name] -= n
            _save(values)
        def report():
            return ['%s: %d' % item for item in sorted(stock().items())]
    superficial:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
        def restock(name, n):
            values = stock()
            values[name] = values.get(name, 0) + n
            STORE.write_text(json.dumps(values))
        def sell(name, n):
            values = stock()
            values[name] = values.get(name, 0) - n
            STORE.write_text(json.dumps(values))
        def report():
            return ['%s: %d' % item for item in sorted(stock().items())]
    variants: [{item: pear}, {item: plum}]

  - id: greeting-options
    workspace: python-cli
    prompt: Write greet(name) in greet.py returning "Hello, <name>!" and check it.
    follow_ups:
      - Let greet take formal=True which returns "Good day, <name>." instead, keeping the default.
      - Add a language parameter where "es" gives "Hola, <name>!" for the default form, keeping everything else.
    grader: |
      from greet import greet
      assert greet('$name') == 'Hello, $name!'
      assert greet('$name', formal=True) == 'Good day, $name.'
      assert greet('$name', language='es') == 'Hola, $name!'
    verification: false
    solution:
      greet.py: |
        def greet(name, formal=False, language='en'):
            if formal:
                return 'Good day, %s.' % name
            return ('Hola, %s!' if language == 'es' else 'Hello, %s!') % name
    superficial:
      greet.py: |
        def greet(name, formal=False, language='en'):
            return 'Hola, %s!' % name if language == 'es' else 'Good day, %s.' % name
    variants: [{name: Ada}, {name: Lin}]

  - id: price-formatter-growth
    workspace: python-cli
    prompt: Write price(cents) in money.py that returns the amount as "$symbol" followed by the value with two decimals, and check it.
    follow_ups:
      - Add thousands separators, so 123456 cents becomes "${symbol}1,234.56", keeping everything else.
      - Show negative amounts as "-${symbol}5.00" for -500, keeping the earlier rules, and check all of them.
    grader: |
      from money import price
      assert price(500) == '${symbol}5.00'
      assert price(123456) == '${symbol}1,234.56'
      assert price(-500) == '-${symbol}5.00'
      assert price(0) == '${symbol}0.00'
    verification: false
    solution:
      money.py: |
        def price(cents):
            sign = '-' if cents < 0 else ''
            return '%s$symbol%s' % (sign, format(abs(cents) / 100, ',.2f'))
    superficial:
      money.py: |
        def price(cents):
            return '-$symbol%s' % format(abs(cents) / 100, ',.2f') if cents < 0 else '$symbol%.2f' % (cents / 100)
    variants: [{symbol: "€"}, {symbol: "£"}]

  - id: ignore-file-rules
    workspace: python-cli
    prompt: Create .ignore listing $first as the only entry and check it; more entries will follow.
    follow_ups:
      - Add *.log, keeping the existing entry, and check the file.
      - Add build/ at the end, keep every earlier entry in order, and check the final file.
    grader: |
      assert Path('.ignore').read_text().split() == ['$first', '*.log', 'build/']
    verification: false
    solution:
      .ignore: |
        $first
        *.log
        build/
    superficial:
      .ignore: |
        *.log
        build/
    variants: [{first: .env}, {first: secrets.json}]

  - id: queue-class-features
    workspace: python-cli
    prompt: Write a Queue class in queue_box.py with push(item) and pop() in first-in, first-out order, and check it.
    follow_ups:
      - Add __len__ so len() gives the number of items, keeping push and pop.
      - Make pop() on an empty queue return $empty instead of raising, keeping everything else, and check all behaviour.
    grader: |
      from queue_box import Queue
      queue = Queue()
      assert queue.pop() == $empty
      queue.push(1)
      queue.push(2)
      assert len(queue) == 2
      assert queue.pop() == 1 and queue.pop() == 2
      assert len(queue) == 0 and queue.pop() == $empty
    verification: false
    solution:
      queue_box.py: |
        from collections import deque
        class Queue:
            def __init__(self):
                self.items = deque()
            def push(self, item):
                self.items.append(item)
            def pop(self):
                return self.items.popleft() if self.items else $empty
            def __len__(self):
                return len(self.items)
    superficial:
      queue_box.py: |
        class Queue:
            def __init__(self):
                self.items = []
            def push(self, item):
                self.items.append(item)
            def pop(self):
                return self.items.pop() if self.items else $empty
            def __len__(self):
                return len(self.items)
    variants: [{empty: None}, {empty: "''"}]

  - id: report-columns
    workspace: python-cli
