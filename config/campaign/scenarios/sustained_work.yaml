  - id: cli-flags-accumulate
    workspace: python-cli
    prompt: Write count.py that prints the number of lines in the file it is given, and check it on words.txt.
    follow_ups:
      - Add a --words flag that prints the number of words instead, keeping the default.
      - Add a --chars flag for the character count, keeping both earlier behaviours, and check all three on words.txt.
    fixtures:
      words.txt: |
        $line
        second line here
    grader: |
      import subprocess, sys as system
      def run(*args):
          return subprocess.run([system.executable, 'count.py', *args, 'words.txt'], capture_output=True, text=True).stdout.strip()
      text = Path('words.txt').read_text()
      assert run() == str(len(text.splitlines()))
      assert run('--words') == str(len(text.split()))
      assert run('--chars') == str(len(text))
    verification: false
    solution:
      count.py: |
        import sys
        args = sys.argv[1:]
        text = open(args[-1]).read()
        if '--words' in args:
            print(len(text.split()))
        elif '--chars' in args:
            print(len(text))
        else:
            print(len(text.splitlines()))
    superficial:
      count.py: |
        import sys
        args = sys.argv[1:]
        text = open(args[-1]).read()
        print(len(text) if '--chars' in args else len(text.split()))
    variants: [{line: alpha beta}, {line: one two three}]

  - id: validation-rules-grow
    workspace: python-cli
    prompt: Write valid(password) in rules.py that requires at least $length characters, and check it.
    follow_ups:
      - Also require at least one digit, keeping the length rule.
      - Also reject passwords containing the word "password" in any case, keeping both earlier rules, and check all of them.
    grader: |
      from rules import valid
      assert valid('abcdefgh1234'[:$length - 1] + '9')
      assert not valid('abc1')
      assert not valid('abcdefghijklmnop')
      assert not valid('myPassWord2024')
    verification: false
    solution:
      rules.py: |
        def valid(password):
            return (len(password) >= $length and any(char.isdigit() for char in password)
                    and 'password' not in password.lower())
    superficial:
      rules.py: |
        def valid(password):
            return 'password' not in password.lower() and any(char.isdigit() for char in password)
    variants: [{length: 8}, {length: 10}]

