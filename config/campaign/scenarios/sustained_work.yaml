  - id: slug-options
    workspace: python-cli
    prompt: Write slug(text) in slugs.py that lowercases the text and joins its words with dashes, and check it.
    follow_ups:
      - Drop any character that is not a letter, digit or space before joining, keeping the rest.
      - Add max_length=$limit that cuts the slug without leaving a trailing dash, keeping everything else, and check it.
    grader: |
      from slugs import slug
      assert slug('Hello World') == 'hello-world'
      assert slug('Rock & Roll!') == 'rock-roll'
      long = slug('alpha beta gamma delta epsilon zeta')
      assert len(long) <= $limit and not long.endswith('-') and 'alpha-beta'.startswith(long[:10])
    verification: false
    solution:
      slugs.py: |
        import re
        def slug(text, max_length=$limit):
            words = re.sub(r'[^a-z0-9 ]', '', text.lower()).split()
            return '-'.join(words)[:max_length].rstrip('-')
    superficial:
      slugs.py: |
        def slug(text, max_length=$limit):
            return '-'.join(text.lower().split())[:max_length]
    variants: [{limit: 14}, {limit: 20}]

  - id: matrix-helpers
    workspace: python-cli
    prompt: Write transpose(rows) in grid.py for a list of equal-length rows, and check it.
    follow_ups:
      - Add total(rows) returning the sum of every cell, keeping transpose.
      - Make transpose return [] for an empty grid and add diagonal(rows) for square grids, keeping everything, and check all three.
    grader: |
      from grid import transpose, total, diagonal
      assert transpose([[1, 2], [3, 4]]) == [[1, 3], [2, 4]]
      assert transpose([]) == []
      assert total([[1, 2], [3, $cell]]) == 6 + $cell
      assert diagonal([[1, 2], [3, $cell]]) == [1, $cell]
    verification: false
    solution:
      grid.py: |
        def transpose(rows):
            return [list(column) for column in zip(*rows)]
        def total(rows):
            return sum(sum(row) for row in rows)
        def diagonal(rows):
            return [rows[index][index] for index in range(len(rows))]
    superficial:
      grid.py: |
        def transpose(rows):
            return [list(column) for column in zip(*rows)]
        def diagonal(rows):
            return [rows[index][index] for index in range(len(rows))]
    variants: [{cell: 9}, {cell: 13}]
