    prompt: Write greet(name) in greet.py returning "Hello, <name>!" and check it.
    follow_ups:
      - Let greet take formal=True which returns "Good day, <name>." instead, keeping the default.
      - Add a language parameter where "es" gives "Hola, <name>!" for the default form, keeping everything else.
    grader: |
      from greet import greet
      assert greet('$name') == 'Hello, $name!'
