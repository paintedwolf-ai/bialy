  - id: inventory-report
    focus: sustained_work
    workspace: python-cli
    prompt: inventory.py tracks stock in stock.json. Add restock(name, n) and check it.
    fixtures:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
    follow_ups:
      - Add sell(name, n) that refuses to go below zero by raising ValueError, keeping restock.
      - 'Add report() returning the items sorted by name as "name: n" lines, and check everything still works.'
    grader: |
      import inventory
      Path('stock.json').unlink(missing_ok=True)
      inventory.restock('$item', 5); inventory.restock('apple', 2)
      inventory.sell('$item', 3)
      try:
          inventory.sell('apple', 3)
          raise AssertionError('oversold')
      except ValueError:
          pass
      assert inventory.report() == sorted(['$item: 2', 'apple: 2'])
    verification: false
    solution:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
        def _save(values):
            STORE.write_text(json.dumps(values))
        def restock(name, n):
            values = stock()
            values[name] = values.get(name, 0) + n
            _save(values)
        def sell(name, n):
            values = stock()
            if values.get(name, 0) < n:
                raise ValueError(name)
            values[name] -= n
            _save(values)
        def report():
            return ['%s: %d' % item for item in sorted(stock().items())]
    superficial:
      inventory.py: |
        import json
        from pathlib import Path
        STORE = Path('stock.json')
        def stock():
            return json.loads(STORE.read_text()) if STORE.exists() else {}
        def restock(name, n):
            values = stock()
            values[name] = values.get(name, 0) + n
            STORE.write_text(json.dumps(values))
        def sell(name, n):
            values = stock()
            values[name] = values.get(name, 0) - n
            STORE.write_text(json.dumps(values))
        def report():
            return ['%s: %d' % item for item in sorted(stock().items())]
    variants: [{item: pear}, {item: plum}]

