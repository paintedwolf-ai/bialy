  - id: todo-commands
    focus: sustained_work
    workspace: python-cli
    prompt: Add an add(text) function to todo.py that appends an item to todo.json (a JSON list), and check it works.
    fixtures:
      todo.py: |
        import json
        from pathlib import Path
        STORE = Path('todo.json')
        def items():
            return json.loads(STORE.read_text()) if STORE.exists() else []
    follow_ups:
      - Now add done(index) that removes that item, keeping add working.
      - Finally add count() returning how many items remain, and run all three together.
    grader: |
      import todo
      Path('todo.json').unlink(missing_ok=True)
      todo.add('$first'); todo.add('b'); todo.add('c')
      todo.done(1)
      assert todo.items() == ['$first', 'c'] and todo.count() == 2
    verification: false
    solution:
      todo.py: |
        import json
        from pathlib import Path
        STORE = Path('todo.json')
        def items():
            return json.loads(STORE.read_text()) if STORE.exists() else []
        def add(text):
            STORE.write_text(json.dumps(items() + [text]))
        def done(index):
            values = items()
            del values[index]
            STORE.write_text(json.dumps(values))
        def count():
            return len(items())
    superficial:
      todo.py: |
        import json
