# Open-weights models the factory may run. A model drives sessions
# (generator) or scores cards (judge) only when a person has read its license
# and recorded that its outputs may train a model released under Apache-2.0
# (outputs_trainable). The configuration refuses any other model.
#
# A row is judged by a model from another family than the one that drove its
# session. GLM-5.3-Flash drives sessions and writes requests; DeepSeek-V4.1-Flash
# judges with reasoning off, and GLM judges a sample again to measure agreement.
# GLM-5.3-Flash is thinking-only: the provider refuses reasoning_effort none.
# Hosted models read their key from the environment variable hosted.key_env;
# price_per_million (list prices, uncached input) totals a run's metered spend.
models:
  - id: qwen3.6-35b-a3b
    hf: Qwen/Qwen3.6-35B-A3B-FP8
    revision: 95a723d08a9490559dae23d0cff1d9466213d989
    family: qwen
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-09-27: Apache-2.0 model card; no terms on outputs"
    roles: [generator]
    serve:
      gpu: 0
      port: 8001
      args: [--tool-call-parser, qwen3_coder, --reasoning-parser, qwen3, --max-num-seqs, "256", --kv-cache-dtype, fp8]
  - id: gemma-4-26b-a4b-it
    hf: google/gemma-4-26B-A4B-it
    revision: 4d7ae4984b7db7de8f8457170b3f1a419ee76d52
    family: gemma
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-09-27: Apache-2.0 model card; no terms on outputs"
    roles: [generator, teacher]
    serve:
      gpu: 1
      port: 8002
      args: [--quantization, fp8, --kv-cache-dtype, fp8, --tool-call-parser, gemma4, --reasoning-parser, gemma4]
  # Consumer-GPU teachers for custom-model collection: pinned GGUF artifacts served
  # by llama-server outside the factory (serve.external), reached through the
  # tunnel in replicas.local.yaml. Their quality reviewer is deepseek-v4.1-flash,
  # the first judge outside each family.
  - id: qwen3.6-35b-a3b-q4
    hf: ggml-org/Qwen3.6-35B-A3B-GGUF
    revision: 7878dc9a905c7c9379e5e8d6a1aa9affdd6839c5
    family: qwen
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-10-20: Apache-2.0 model card; a llama.cpp conversion of Qwen/Qwen3.6-35B-A3B (Apache-2.0); no terms on outputs"
    roles: [generator, teacher]
    serve:
      port: 8011
      external: {model: qwen3.6-35b-a3b-q4, artifact: Qwen3.6-35B-A3B-Q4_K_M.gguf,
                 artifact_sha256: 671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7}
  - id: gemma-4-26b-a4b-it-q4
    hf: google/gemma-4-26B-A4B-it-qat-q4_0-gguf
    revision: d1c082be9cf3c8a514acf63b8761f4b41935842e
    family: gemma
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-10-20: Apache-2.0 model card; Google's own QAT q4_0 of google/gemma-4-26B-A4B-it (Apache-2.0); no terms on outputs"
    roles: [generator, teacher]
    serve:
      port: 8012
      external: {model: gemma-4-26b-a4b-it-q4, artifact: gemma-4-26B_q4_0-it.gguf,
                 artifact_sha256: 3eca3b8f6d7baf218a7dd6bba5fb59a56ee25fe2d567b6f5f589b4f697eca51d}
  - id: glm-5.3-flash
    hf: zai-org/GLM-5.3-Flash
    revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
    family: glm
    license: MIT
    outputs_trainable: true
    reviewed: "2026-09-28: MIT license, no terms on outputs"
    roles: [generator, judge, writer]
    hosted: {provider: fireworks, base_url: "https://api.fireworks.ai/inference/v1", model: accounts/fireworks/models/glm-5p3-flash, key_env: FIREWORKS_API_KEY,
             price_per_million: {input: 0.15, output: 0.50}}
  - id: deepseek-v4.1-flash
    hf: deepseek-ai/DeepSeek-V4.1-Flash
    revision: 2cba9e42aa026125f3ed06c6d98c1db82f7ca027
    family: deepseek
    license: MIT
    outputs_trainable: true
    reviewed: "2026-10-01: MIT license on the model card; no terms on outputs (Chris Beckman)"
    roles: [generator, judge]
    hosted: {provider: fireworks, base_url: "https://api.fireworks.ai/inference/v1", model: accounts/fireworks/models/deepseek-v4p1-flash, key_env: FIREWORKS_API_KEY,
             price_per_million: {input: 0.30, output: 1.20}, reasoning_effort: none}
  - id: gemma-4-31b-it
    hf: google/gemma-4-31B-it
    revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
    family: gemma
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-10-19: Apache-2.0 model card; no terms on outputs"
    roles: [teacher]
    serve:
      gpu: 1
      port: 8003
      args: [--quantization, fp8, --kv-cache-dtype, fp8, --tool-call-parser, gemma4, --reasoning-parser, gemma4]
  - id: gemma-4-e4b-it
    hf: google/gemma-4-E4B-it
    revision: ee0ef6023621cff504d758262d4e04895a5af4a2
    family: gemma
    license: Apache-2.0
    outputs_trainable: true
    reviewed: "2026-10-19: Apache-2.0 model card; no terms on outputs"
    roles: [student]
    serve:
      gpu: 1
      port: 8004
      args: [--tool-call-parser, gemma4, --reasoning-parser, gemma4]

