# Where the factory runs and how hard it pushes the GPU host.
root: /scratch/bialy               # everything the factory writes on the host
network:
  name: bialy                      # private Docker bridge; vLLM binds only to its gateway
  subnet: 172.30.0.0/22
  gateway: 172.30.0.1
fleet:
  runners: 320                     # concurrent runner containers; each takes a bridge address
  cpus: 2                          # per runner
  memory: 8g                       # per runner (a cap, not a reservation)
  pids: 2048                       # per runner
  tasks_per_shard: 8               # most tasks one runner drives, one after another, in one project
  shard_minutes: 720               # a shard holds only as many tasks as fit, at their prompt budget
  prompt_timeout: 60m              # per prompt; a turn that finishes slowly under load is still a label
  image: bialy-runner
split:
  seed: 7
  # Components outside the held-out workspaces; held-out workspaces are system_test.
  fractions: {train: 0.7, validation: 0.15, development: 0.15}
judge:
  second_judge_fraction: 0.10      # rows another reviewer slot judges for agreement

# `bialy run`: one pass on this machine, resumable. Paths resolve against the
# repository. The generators named here must be hosted or served on this host;
# reviewers use configured slots, and the writer writes skill requests
# and code-rank pairs.
run:
  lycaon_checkout: ../paintedwolf-code   # built into the runner binaries, engine, and trainer the run uses
  generators: [gemma-4-26b-a4b-it, muse-glimmer-30b, gemma-4-31b, beam-1.0-501b, mistral-large-4]
  generator_weights:                     # hybrid local + hosted driving shares
    gemma-4-26b-a4b-it: 0.38
    muse-glimmer-30b: 0.25
    gemma-4-31b: 0.20
    beam-1.0-501b: 0.12
    mistral-large-4: 0.05
  archetype_generators:
    # Routine orientation, search, and chores weight local Gemma 26B with Gemma 31B
    conceptual_question: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    repository_question: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    explain_code: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    locate: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    git_history: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    data_files: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    docs: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    chores: {gemma-4-26b-a4b-it: 0.80, gemma-4-31b: 0.20}
    # Mainstream coding, verification, web, and greenfield share local Gemma 26B, Muse, and Gemma 31B
    bugfix: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    small_change: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    run_and_verify: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    commit: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    web: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    docs_online: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    dependencies: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    new_module: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    project_setup: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    ui_mockup: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    ops: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    new_project: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    prototype: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    public_api_cli: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    scaffold: {gemma-4-26b-a4b-it: 0.40, muse-glimmer-30b: 0.35, gemma-4-31b: 0.25}
    # Hard multi-file, architecture, compliance, security, and auth weight Beam 1.0 501B, Muse, Gemma 31B, and Mistral Large 4
    refactor: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    design_review: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    compliance_audit: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    security: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    security_survey: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    secrets_and_auth: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    multi_part: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    research_change: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    greenfield_auth: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
    port: {beam-1.0-501b: 0.30, muse-glimmer-30b: 0.30, gemma-4-31b: 0.20, mistral-large-4: 0.20}
  local_workers_only: false              # when true, sidecar lite and agent_pool use local served generators
  judges: [gemma-4-26b-a4b-it, beam-1.0-501b, mistral-large-4]  # local Gemma card judge + cross-family independent reviewers
  runners: 4                       # concurrent runner containers on this machine
  task_timeout: null               # optional whole-task wall-clock cap, including follow-ups, e.g. 45m
  tasks_per_runner: null           # optional shard size override; use 1 for smokes
  preflight: {enabled: true, timeout_seconds: 300}
  fail_fast: {enabled: true, summary_length_limit: 2, capture_turn_limit: 3, task_failure_codes: []}
  spend_ceiling_usd: 0             # 0 leaves the ceiling off; priced models add up in the report
  scanner: pinned                  # the checkout's pinned Opengrep for linux/amd64; candidate takes a local build; none runs without one
  scanner_candidate: null          # for candidate: the downstream repository's artifact directory (opengrep, provenance.json, source-lock.json)
  engine_on:
    enabled: true                  # a second pass with the pilot heads deciding
    deadline_ms: 120000            # turn decision deadline for the runners' CPU engine; a 2-CPU runner's first turns run long
  skillreq:
    writer: gemma-4-26b-a4b-it     # the configured writer in models.yaml
    families: {clear: 2, nearmiss: 1, multi: 1}   # request families per skill and kind
    none_families: 24
    per_family: 6
  coderank:
    per_repo: 40                   # written request pairs per repository
  evaluate:
    rows: 500                      # validation and held-out rows each replayed through the host engine; 0 replays every row
  judge:
    enabled: true                  # false keeps observational rows unjudged
  retention:                       # the retention head (src/bialy/retention.py)
    follow_up_rate: null           # override every archetype's follow-up rate; 1.0 keeps every follow-up, and each is a retention decision
    follow_ups: null               # override the follow-ups a task may carry (archetypes.yaml defaults.max_follow_ups); longer sessions reach the watermark
    search:                        # the trainer grid; every head is replayed and the best fitted objective on validation is kept
      lr: [0.0002, 0.0005, 0.001]
      pos_weight: [2.0, 6.0]
      truth: [needed, later]
    bootstrap: 500                 # resampled rows behind every interval the verdict reads
    min_rows: 20                   # held-out rows under which no interval is trusted
  train:
    recipes: [B5, B7G, E4, code-rank]   # retention is an explicit R1 experiment
    device: auto                   # cuda (including ROCm builds of torch), mps, or cpu
    max_hours: 24                  # for all recipes of one training stage together
    torch_index: null              # a torch wheel index; detected from the accelerator when null
    epochs: null                   # cap for short checks; null keeps each recipe's own
  custom_model:
    enabled: false                 # custom-model collection is opt-in
    diagnostic_only: false         # allow a host without the receipt exporter; its captures cannot train
    student: gemma-4-e4b-it        # student model evaluated in shadow mode with thinking off
    teacher: mistral-large-4       # teacher model that repairs host rejections and nudges (repair stays off)
    min_score: 3                   # minimum judge score for synthetic engine-on preloading and skill/tool gates
    epoch: null                    # explicit collection identity; each collection takes a new one
    host_commit: null              # exact clean Painted Wolf Code commit used by this run
    preload_from_judge: false      # reconstructed surfaces remain candidates, not training examples
    max_routine_reads_per_session: 6   # cap mid-loop unscoped single-root read/grep/list_dir steps per session in SFT
    shadow: false                  # query the student at teacher states to harvest divergence DPO pairs
    repair: false                  # query the teacher at student rejection states that lack a self-repair
