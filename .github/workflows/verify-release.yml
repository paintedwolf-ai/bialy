# Check a published release as a consumer would receive it: fetch the tagged
# revision from the Hub and verify it is complete and matches its checksums.
# Releases are built and published from the GPU host; this never publishes.
name: Verify release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Release to verify
        type: choice
        options: [dataset, heads]
      version:
        description: Release tag on the Hub (for example v1)
        required: true

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.kind }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra hub

      - name: Fetch and verify
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BIALY_HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          BIALY_HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run bialy fetch "$KIND" --version "$VERSION" --out release
          uv run bialy verify "$KIND" --release release
