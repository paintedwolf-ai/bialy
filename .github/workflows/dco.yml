name: Original commit certification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number to certify again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  statuses: write
# One queue per pull request or merge group: a burst across many pull requests cannot fill a shared queue.
concurrency:
  group: dco-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.merge_group.head_ref || inputs.pull_request || github.event.workflow_run.head_branch || github.run_id }}
  queue: max
  cancel-in-progress: false
jobs:
  certify:
    if: (github.event_name != 'pull_request_target' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Certify original PR commits
        uses: paintedwolf-ai/dco-checker@8c6c06538ecb5bde705fecdef9dcb51202635b49
