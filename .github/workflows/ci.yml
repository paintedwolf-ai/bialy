# Everything a change can be checked with cheaply. Generation, judging, and
# training run on a GPU host, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q tests

      - name: Configuration and pins
        env:
          BIALY_HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          BIALY_HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: uv run bialy check

      - name: Runner and training-host scripts
        run: shellcheck runner/*.sh && shellcheck -x train-host/student/*.sh
