[project]
name = "bialy"
version = "0.1.0"
description = "Open dataset factory for the Painted Wolf Code decision heads"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "openai>=1.40", "jsonschema>=4.23"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bialy = "bialy.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Explicit, so CI does not change with the ruff version: pyflakes, the error and
# syntax subsets of pycodestyle, bugbear, and import order.
select = ["E4", "E7", "E9", "F", "B", "I"]
